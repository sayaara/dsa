# Trend Quality screening strategy
name: momentum_quality
display_name: Trend Quality
description: Mid-term candidate discovery that combines trend confirmation with fundamental quality
version: "1.1"
category: framework
tags: [momentum, quality, trend, llm_friendly]
analysis_skills: [bull_trend, growth_quality]
style:
  risk_profile: balanced
  holding_period: swing
  execution_style: trend_quality
  market_regime: [risk_on, trend, rotation]
  capital_profile: high_liquidity
  ui_badge: Trend

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    amount_min: 60000000
    market_cap_min: 5000000000
    pe_ttm_min: 0
    pe_ttm_max: 60
    pb_min: 0
    pb_max: 15.0
    change_pct_min: -3.5
    change_pct_max: 7.5
    price_min: 5
  tech_weight: 0.45
  factor_weights:
    momentum: 0.28
    value: 0.15
    liquidity: 0.18
    activity: 0.15
    stability: 0.12
    reversal: 0.04
    theme_heat: 0.06
    size: 0.02
  scoring_profile:
    momentum_chase_start_pct: 5.0
    momentum_chase_penalty_slope: 14.0
    activity_ideal_volume_ratio: 2.2
    activity_ideal_turnover_rate: 0.9
    stability_hot_change_pct: 6.5
  risk_profile:
    chase_change_pct: 7.5
    abnormal_volume_ratio: 5.5
    high_turnover_rate: 2.8
    low_llm_confidence: 0.50
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.5
    buckets:
      Financials: [Banks, Insurance, Capital Markets]
      Consumer: [Beverages, Packaged Foods, Household, Retail]
      Technology: [Semiconductors, Software, Data Center, Cloud, AI]
      Clean energy: [Solar, Renewable, Battery, Storage]
      Cyclicals: [Steel, Coal, Metals, Mining, Chemicals]
      Utilities: [Utilities, Electric, Water, Gas]
  scorecard_profile:
    value_quality_bonus: 1.8
    capital_confirmed_bonus: 2.4
    volume_spike_ratio: 5.0
    hot_money_penalty: 2.5
  ranking_hints: |
    Prioritize:
    1. Candidates whose trend is confirmed but that have not entered an extreme chase phase
    2. Fundamental quality (valuation, liquidity, stability) that supports the trend
    3. Avoid concentrating on a single theme and balance trend opportunities across styles
  max_output: 5
