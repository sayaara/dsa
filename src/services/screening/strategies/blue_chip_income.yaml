# Blue-Chip Income Quality screening strategy
name: blue_chip_income
display_name: Blue-Chip Income Quality
description: Income-quality candidates among highly liquid large-cap blue chips, stressing reasonable valuation, steady trading and a defensive holding profile
version: "1.0"
category: income
tags: [value, quality, income, blue_chip, defensive, snapshot_only]
style:
  risk_profile: defensive
  holding_period: watchlist
  execution_style: income_quality
  market_regime: [risk_off, range_bound, low_rate]
  capital_profile: high_liquidity
  ui_badge: Blue chip

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    amount_min: 40000000
    market_cap_min: 50000000000
    pe_ttm_min: 0
    pe_ttm_max: 22
    pb_min: 0
    pb_max: 6.0
    turnover_rate_min: 0.08
    volume_ratio_min: 0.6
    change_pct_min: -3.0
    change_pct_max: 4.0
    price_min: 5
  tech_weight: 0.18
  factor_weights:
    value: 0.30
    stability: 0.26
    liquidity: 0.18
    size: 0.12
    activity: 0.06
    momentum: 0.05
    reversal: 0.03
  scoring_profile:
    momentum_chase_start_pct: 2.8
    momentum_chase_penalty_slope: 18.0
    momentum_downside_start_pct: -3.0
    activity_ideal_volume_ratio: 1.1
    activity_ideal_turnover_rate: 0.36
    activity_high_volume_ratio: 3.5
    activity_high_turnover_rate: 1.4
    stability_hot_change_pct: 4.0
    stability_high_turnover_rate: 1.4
    stability_high_volume_ratio: 3.5
  risk_profile:
    chase_change_pct: 4.8
    abnormal_volume_ratio: 3.5
    high_turnover_rate: 1.6
    invalid_pe_points: 8.0
    high_pb: 4.5
    high_pb_points: 5.0
    low_llm_confidence: 0.45
  portfolio_profile:
    max_same_bucket: 2
    concentration_penalty: 3.0
    buckets:
      Financials: [Banks, Insurance, Capital Markets]
      Dividend assets: [Telecom, Utilities, Tobacco, Pipelines, REIT, Midstream]
      Consumer staples: [Beverages, Packaged Foods, Household, Discount Stores]
      Industrial leaders: [Machinery, Aerospace, Auto, Electrical Equipment]
  scorecard_profile:
    value_quality_value_min: 74.0
    value_quality_stability_min: 70.0
    value_quality_bonus: 2.5
    low_llm_confidence: 0.45
    low_llm_confidence_penalty: 1.0
    volume_spike_ratio: 3.5
    volume_spike_penalty: 1.5
  ranking_hints: |
    Prioritize:
    1. Large-cap, high-turnover blue chips or dividend assets whose valuation is not visibly stretched
    2. Steady trading volume and turnover, not dependent on a one-day volume spike or a short-term theme rally
    3. Industry position, cash flow, dividend stability or defensive traits should explain the holding logic
  max_output: 5
