# Dual Low Value screening strategy
name: dual_low
display_name: Dual Low Value
description: A steady low-valuation screen, combined with same-day activity and pattern confirmation, so it does not keep matching the same statically cheap stocks
version: "1.2"
category: value
tags: [value, defensive, low_valuation, dynamic_signal]
style:
  risk_profile: defensive
  holding_period: watchlist
  execution_style: mean_reversion
  market_regime: [risk_off, range_bound]
  capital_profile: medium_liquidity
  ui_badge: Value

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    amount_min: 10000000
    pe_ttm_min: 0
    pe_ttm_max: 15
    pb_min: 0
    pb_max: 3.5
    market_cap_min: 2000000000
    market_cap_max: 500000000000
    price_min: 5
    change_pct_min: -4.5
    change_pct_max: 4.5
  tech_weight: 0.2
  factor_weights:
    value: 0.34
    stability: 0.20
    liquidity: 0.14
    momentum: 0.10
    activity: 0.10
    reversal: 0.06
    size: 0.06
  scoring_profile:
    momentum_chase_start_pct: 2.5
    momentum_chase_penalty_slope: 18.0
    momentum_downside_start_pct: -2.5
    activity_ideal_volume_ratio: 1.2
    activity_ideal_turnover_rate: 0.4
    activity_high_volume_ratio: 4.0
    activity_high_turnover_rate: 1.6
    stability_hot_change_pct: 4.0
    stability_high_turnover_rate: 1.6
    stability_high_volume_ratio: 4.0
  risk_profile:
    chase_change_pct: 5.0
    abnormal_volume_ratio: 4.0
    high_turnover_rate: 1.6
    low_llm_confidence: 0.45
  portfolio_profile:
    max_same_bucket: 2
    concentration_penalty: 3.0
    buckets:
      Financials: [Banks, Insurance, Capital Markets]
      Real estate chain: [Real Estate, REIT, Homebuilders, Building Materials, Furnishings]
      Cyclicals: [Steel, Coal, Metals, Mining, Chemicals]
  scorecard_profile:
    value_quality_value_min: 72.0
    value_quality_stability_min: 65.0
    value_quality_bonus: 3.0
    volume_spike_ratio: 4.0
  ranking_hints: |
    Prioritize:
    1. Low PE and low PB remain the base, but do not repeatedly pick the same banks, real estate and cyclicals just because they are cheap
    2. Prefer value-recovery candidates with moderate same-day trading activity and no chase-high or breakdown risk
    3. Industry position, cash flow, dividend stability and recent catalysts should explain the valuation-recovery logic
  max_output: 5
