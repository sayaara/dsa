# Steady Value screening strategy
name: quality_value
display_name: Steady Value
description: Steady candidates with reasonable valuation, ample liquidity and moderate volatility that also show mild activity confirmation
version: "1.1"
category: value
tags: [value, quality, stability, dynamic_signal]
style:
  risk_profile: defensive
  holding_period: watchlist
  execution_style: quality_value
  market_regime: [risk_off, range_bound]
  capital_profile: medium_liquidity
  ui_badge: Steady

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    amount_min: 20000000
    pe_ttm_min: 0
    pe_ttm_max: 25
    pb_min: 0
    pb_max: 8.0
    market_cap_min: 8000000000
    market_cap_max: 1000000000000
    change_pct_min: -3.5
    change_pct_max: 5.0
    price_min: 5
  tech_weight: 0.15
  factor_weights:
    value: 0.32
    stability: 0.24
    liquidity: 0.18
    momentum: 0.08
    activity: 0.08
    reversal: 0.04
    size: 0.06
  scoring_profile:
    momentum_chase_start_pct: 3.0
    momentum_chase_penalty_slope: 16.0
    activity_ideal_volume_ratio: 1.4
    activity_ideal_turnover_rate: 0.5
    stability_hot_change_pct: 4.5
    stability_high_turnover_rate: 1.6
    stability_high_volume_ratio: 4.0
  risk_profile:
    chase_change_pct: 5.5
    abnormal_volume_ratio: 4.5
    high_turnover_rate: 2.0
    low_llm_confidence: 0.45
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.5
    buckets:
      Financials: [Banks, Insurance, Capital Markets]
      Consumer: [Beverages, Packaged Foods, Household, Retail]
      Utilities: [Utilities, Electric, Water, Gas]
  scorecard_profile:
    value_quality_value_min: 72.0
    value_quality_stability_min: 68.0
    value_quality_bonus: 2.8
    volume_spike_ratio: 4.0
  ranking_hints: |
    Prioritize:
    1. Reasonable valuation that does not depend on one-day sentiment
    2. Enough dollar volume and gains that are not overheated, suitable for deeper analysis
    3. Look for industry position, cash-flow quality, dividends or operating stability
  max_output: 5
