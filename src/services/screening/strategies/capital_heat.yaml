# Capital Heat screening strategy
name: capital_heat
display_name: Capital Heat
description: Short-term candidates with active capital flow and synchronized price and volume that are not yet extremely overheated
version: "1.1"
category: momentum
tags: [momentum, capital_flow, short_term]
analysis_skills: [hot_theme, emotion_cycle]
style:
  risk_profile: aggressive
  holding_period: short_term
  execution_style: momentum
  market_regime: [risk_on, high_liquidity]
  capital_profile: high_liquidity
  ui_badge: Heat

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    amount_min: 100000000
    turnover_rate_min: 0.4
    volume_ratio_min: 1.5
    change_pct_min: 1.0
    change_pct_max: 12.0
    price_min: 5
  tech_weight: 0.65
  factor_weights:
    momentum: 0.32
    activity: 0.28
    liquidity: 0.16
    theme_heat: 0.10
    stability: 0.10
    reversal: 0.04
  scoring_profile:
    momentum_chase_start_pct: 6.5
    momentum_chase_penalty_slope: 12.0
    activity_ideal_volume_ratio: 2.8
    activity_high_volume_ratio: 7.0
    activity_ideal_turnover_rate: 1.2
    activity_high_turnover_rate: 3.6
    stability_hot_change_pct: 8.5
    theme_heat_overheat_score: 92.0
    theme_heat_overheat_penalty_slope: 0.35
  risk_profile:
    chase_change_pct: 9.3
    abnormal_volume_ratio: 8.0
    high_turnover_rate: 4.4
    weak_signal_score: 40.0
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 5.0
    buckets:
      Financials: [Banks, Insurance, Capital Markets]
      AI and semiconductors: [Semiconductors, Software, Data Center, Cloud, AI]
      Clean energy: [Solar, Renewable, Battery, Storage]
      Cyclicals: [Steel, Coal, Metals, Mining, Chemicals]
      Robotics: [Robotics, Automation, Industrial Machinery]
  scorecard_profile:
    capital_confirmed_bonus: 2.4
    volume_spike_ratio: 8.0
    hot_money_activity_min: 95.0
    hot_money_penalty: 1.5
  ranking_hints: |
    Prioritize:
    1. Capital heat that moves together with price performance, not just a late-session spike
    2. Gains that are not yet exhausted, with volume ratio and turnover in a sustainable range
    3. Signs of spreading across the sector or theme; avoid isolated pulses
  max_output: 5
