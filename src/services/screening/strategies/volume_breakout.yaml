# Volume Breakout screening strategy
name: volume_breakout
display_name: Volume Breakout
description: Volume expands through a key resistance level, a trend-start signal
version: "1.2"
category: trend
tags: [momentum, volume, breakout]
analysis_skills: [volume_breakout]
style:
  risk_profile: aggressive
  holding_period: short_term
  execution_style: breakout
  market_regime: [risk_on, trend, high_volume]
  capital_profile: high_liquidity
  ui_badge: Breakout

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    amount_min: 30000000
    turnover_rate_min: 0.6
    volume_ratio_min: 2.0
    change_pct_min: 2.0
    change_pct_max: 12.0
    require_price_above_ma20: true
    signal_score_min: 60
    macd_status_whitelist: [bullish, neutral]
    breakout_20d_pct_min: -1.0
    range_20d_pct_max: 35.0
    volume_ratio_20d_min: 1.3
    body_pct_min: 0.5
    consolidation_days_20d_min: 8
  tech_weight: 0.6
  factor_weights:
    momentum: 0.32
    activity: 0.28
    liquidity: 0.22
    theme_heat: 0.08
    stability: 0.10
  scoring_profile:
    momentum_chase_start_pct: 7.0
    momentum_chase_penalty_slope: 11.0
    activity_ideal_volume_ratio: 3.0
    activity_high_volume_ratio: 9.0
    activity_ideal_turnover_rate: 1.2
    activity_high_turnover_rate: 4.0
    stability_hot_change_pct: 8.8
  risk_profile:
    chase_change_pct: 9.8
    abnormal_volume_ratio: 9.0
    high_turnover_rate: 4.8
    weak_signal_score: 45.0
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 5.0
    buckets:
      Financials: [Banks, Insurance, Capital Markets]
      AI and semiconductors: [Semiconductors, Software, Data Center, Cloud, AI]
      Clean energy: [Solar, Renewable, Battery, Storage]
      Cyclicals: [Steel, Coal, Metals, Mining, Chemicals]
      Robotics: [Robotics, Automation, Industrial Machinery]
  scorecard_profile:
    capital_confirmed_bonus: 2.2
    volume_spike_ratio: 9.0
    hot_money_activity_min: 96.0
    hot_money_penalty: 1.4
  ranking_hints: |
    Prioritize:
    1. An obvious consolidation before the breakout (at least 10 trading days)
    2. Volume ratio and turnover expand together on the breakout day while the daily-bar signal stays healthy
    3. After the breakout the price should at least hold above MA20; prefer candidates with a cleaner moving-average structure
    4. A sympathy move in the sector is a plus
  max_output: 5
