# Shrinking-Volume Pullback screening strategy
name: shrink_pullback
display_name: Shrinking-Volume Pullback
description: An uptrend pulling back on shrinking volume to moving-average support, an entry for trend continuation
version: "1.1"
category: trend
tags: [trend, pullback, daily_k]
analysis_skills: [shrink_pullback]
style:
  risk_profile: balanced
  holding_period: swing
  execution_style: pullback_continuation
  market_regime: [risk_on, trend]
  capital_profile: medium_liquidity
  ui_badge: Pullback

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    amount_min: 20000000
    turnover_rate_min: 0.2
    require_ma_bullish: true
    require_price_above_ma20: true
    signal_score_min: 65
    volume_ratio_20d_max: 1.5
    pullback_to_ma20_pct_min: -2.0
    pullback_to_ma20_pct_max: 8.0
    volatility_20d_pct_max: 45.0
    max_drawdown_20d_pct_min: -12.0
    atr_20_pct_max: 6.5
  tech_weight: 0.5
  factor_weights:
    momentum: 0.32
    stability: 0.22
    activity: 0.18
    liquidity: 0.15
    value: 0.08
    reversal: 0.05
  scoring_profile:
    momentum_60d_overheat_pct: 35.0
    momentum_chase_start_pct: 5.0
    momentum_chase_penalty_slope: 14.0
    activity_ideal_volume_ratio: 1.0
    activity_ideal_turnover_rate: 0.5
    activity_high_volume_ratio: 4.5
    stability_hot_change_pct: 5.5
    stability_high_volatility_pct: 40.0
    stability_max_drawdown_floor_pct: -10.0
    stability_high_atr_pct: 5.5
  risk_profile:
    chase_change_pct: 6.5
    abnormal_volume_ratio: 4.5
    high_turnover_rate: 2.4
    weak_signal_score: 60.0
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.0
    buckets:
      Financials: [Banks, Insurance, Capital Markets]
      AI and semiconductors: [Semiconductors, Software, Data Center, Cloud, AI]
      Clean energy: [Solar, Renewable, Battery, Storage]
      Robotics: [Robotics, Automation, Industrial Machinery]
  scorecard_profile:
    capital_confirmed_bonus: 1.4
    volume_spike_ratio: 4.5
  ranking_hints: |
    Among candidates that meet the shrinking-volume pullback pattern, prefer:
    1. A moderate pullback with the trend structure intact
    2. Clearly shrinking volume, consistent with a shakeout rather than distribution
    3. No recent major negative news
  max_output: 5
