# Balanced Multi-Factor screening strategy
name: balanced_alpha
display_name: Balanced Multi-Factor
description: General candidate discovery that blends valuation, liquidity, momentum and stability
version: "1.1"
category: framework
tags: [multi_factor, balanced, llm_friendly]
analysis_skills: [bull_trend]
style:
  risk_profile: balanced
  holding_period: watchlist
  execution_style: multi_factor
  market_regime: [neutral, rotation]
  capital_profile: medium_liquidity
  ui_badge: Multi-factor

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    amount_min: 30000000
    market_cap_min: 2000000000
    pe_ttm_min: 0
    pe_ttm_max: 80
    pb_min: 0
    pb_max: 15.0
    change_pct_min: -4.0
    change_pct_max: 8.5
    price_min: 5
  tech_weight: 0.35
  factor_weights:
    value: 0.22
    liquidity: 0.18
    momentum: 0.20
    activity: 0.15
    stability: 0.12
    reversal: 0.05
    theme_heat: 0.05
    size: 0.03
  scoring_profile:
    momentum_chase_start_pct: 5.5
    momentum_chase_penalty_slope: 12.0
    activity_ideal_volume_ratio: 2.0
    activity_ideal_turnover_rate: 0.8
    stability_hot_change_pct: 7.0
  risk_profile:
    chase_change_pct: 8.0
    abnormal_volume_ratio: 6.0
    high_turnover_rate: 3.0
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.0
    buckets:
      Financials: [Banks, Insurance, Capital Markets]
      Consumer: [Beverages, Packaged Foods, Household, Retail]
      Technology: [Semiconductors, Software, Data Center, Cloud, AI]
      Clean energy: [Solar, Renewable, Battery, Storage]
      Cyclicals: [Steel, Coal, Metals, Mining, Chemicals]
      Utilities: [Utilities, Electric, Water, Gas]
  scorecard_profile:
    value_quality_bonus: 2.2
    capital_confirmed_bonus: 1.8
    volume_spike_ratio: 5.5
    hot_money_penalty: 2.2
  ranking_hints: |
    Prioritize:
    1. Prefer candidates that are solid on several dimensions rather than extreme on a single metric
    2. The LLM should compare the style differences between candidates and avoid a final list concentrated on one thesis
    3. Explain clearly any conflict between valuation, liquidity, trend and risk
  max_output: 5
