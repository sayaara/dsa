# Oversold Reversal screening strategy
name: oversold_reversal
display_name: Oversold Reversal
description: Reversal candidates with a controlled decline, intact liquidity and worth watching for a rebound
version: "1.1"
category: reversal
tags: [reversal, oversold, repair]
analysis_skills: [bottom_volume]
style:
  risk_profile: balanced
  holding_period: short_term
  execution_style: reversal
  market_regime: [oversold_repair, range_bound]
  capital_profile: medium_liquidity
  ui_badge: Reversal

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    amount_min: 20000000
    turnover_rate_min: 0.2
    change_pct_min: -8.0
    change_pct_max: -1.0
    pe_ttm_min: 0
    pe_ttm_max: 80
    pb_min: 0
    pb_max: 15.0
    price_min: 5
  tech_weight: 0.45
  factor_weights:
    reversal: 0.40
    stability: 0.20
    liquidity: 0.18
    value: 0.16
    activity: 0.06
  scoring_profile:
    reversal_ideal_change_pct: -3.5
    reversal_collapse_start_pct: -7.0
    reversal_collapse_penalty_slope: 12.0
    reversal_chase_start_pct: 0.0
    rsi_oversold_bonus: 14.0
    momentum_downside_start_pct: -4.0
    activity_ideal_volume_ratio: 1.6
    activity_ideal_turnover_rate: 0.6
  risk_profile:
    breakdown_change_pct: -8.5
    chase_change_pct: 5.0
    abnormal_volume_ratio: 5.0
    high_turnover_rate: 2.4
    weak_signal_score: 35.0
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.0
    buckets:
      Real estate chain: [Real Estate, REIT, Homebuilders, Building Materials, Furnishings]
      Consumer: [Beverages, Packaged Foods, Household, Retail]
      Cyclicals: [Steel, Coal, Metals, Mining, Chemicals]
      Financials: [Banks, Insurance, Capital Markets]
  scorecard_profile:
    controlled_reversal_min: 70.0
    controlled_reversal_bonus: 2.0
    volume_spike_ratio: 5.5
  ranking_hints: |
    Prioritize:
    1. A controlled decline that is not a run of sell-offs driven by fundamentals or delisting risk
    2. Turnover and dollar volume that can still support a rebound, avoiding a liquidity collapse
    3. Raise priority when there are clues of an overreaction, an event resolved or a sector recovery
  max_output: 5
