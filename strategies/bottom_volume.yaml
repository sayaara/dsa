# Bottom Volume Surge Strategy
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.
# After extended decline, price stabilizes and volume spikes. Potential reversal.

name: bottom_volume
display_name: Bottom Volume
description: Detects a volume surge at the bottom after a long decline, a potential trend-reversal signal.
category: reversal
core_rules: [2, 5]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [bottom volume, bottom volume surge, volume at the bottom, selling exhaustion]
default_priority: 60
market_regimes: [trending_down]

instructions: |
  **Bottom Volume Surge Strategy**

  Reversal criteria:

  1. **Sustained decline confirmed**:
     - Use `get_daily_history` (30 days).
     - The price fell > 15% from the 20-day high to the recent low.
     - `analyze_trend` → trend_status should be BEAR or STRONG_BEAR.

  2. **Volume surge**:
     - Today's volume > 3x the 5-day average.
     - `get_realtime_quote` → volume_ratio > 3.0.
     - The surge should come after a period of very low volume.

  3. **Price stabilization**:
     - Today's candle closes up (close > open).
     - The price holds the recent low.
     - Ideally a long lower shadow, showing buyer support.

  4. **Confirming factors** (core idea 5: risk screening):
     - Use `search_stock_news` to check for a fundamental catalyst.
     - Chip distribution: the average cost is close to the current price (cost convergence).

  5. **Risk notes** (core idea 2: trend trading):
     - This is a reversal signal, riskier than trend following.
     - Suggest a small position (at most 20-30%).
     - The stop loss must be strict (below the recent low).

  Score adjustments:
  - Confirmed bottom volume surge: sentiment_score +8
  - With an up candle + a news catalyst: an extra +5
  - Note "bottom volume surge" in `buy_reason` and `pattern_analysis`.
  - Set the stop loss at the recent low.
