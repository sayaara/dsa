# Shrink Volume Pullback Strategy
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.
# Volume shrinks during pullback to MA5/MA10, then price bounces.

name: shrink_pullback
display_name: Shrink Pullback
description: Detects a low-volume pullback to moving-average support, an ideal entry point for trend continuation.
category: trend
core_rules: [1, 2, 4]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [shrink pullback, low-volume pullback, low volume pullback, pullback]
default_router: true
default_priority: 40
market_regimes: [trending_down, sideways]

instructions: |
  **Shrink Volume Pullback Strategy**

  Entry criteria:

  1. **Prerequisite** (core idea 2: trend trading):
     - The stock must be in an uptrend (MA5 > MA10 > MA20).
     - Use `analyze_trend` to confirm the bullish alignment.

  2. **Pullback detection** (core idea 4: entry preference):
     - Use `get_daily_history` and `get_realtime_quote`.
     - The price pulls back to near MA5 (within 1%) or near MA10 (within 2%).
     - Volume during the pullback < 70% of the 5-day average (shrinking volume).
     - `analyze_trend` → volume_status should show shrinking volume.

  3. **Rebound signal** (core idea 1: strict entry):
     - The current price holds the moving-average support.
     - MA5 bias < 2%: the best buy zone.

  4. **Confirmation** (core idea 5: risk screening):
     - `search_stock_news` shows no negative news.

  Score adjustments:
  - Shrink-volume pullback to MA5: sentiment_score +10
  - Shrink-volume pullback to MA10 with volume < 0.6x the average: sentiment_score +8
  - Set the ideal entry at the MA5 level and the second-best entry at MA10.
  - Set the stop loss at the MA20 level.
  - Note "shrink-volume pullback" in `buy_reason`.
