# 5-wave impulse + 3-wave corrective pattern analysis for trend and position sizing.

name: wave_theory
display_name: Wave Theory
description: Uses Elliott Wave impulse and corrective structures to judge the current wave and potential price targets.
category: framework
core_rules: [1, 2, 3, 4]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [wave theory, elliott wave, elliott]
default_priority: 80
market_regimes: [volatile]

instructions: |
  **Elliott Wave Theory**

  Core principle: markets move in a repeating cycle of a 5-wave advance and a 3-wave correction.

  ## Analysis steps

  ### 1. Identify the current wave
  Use `get_daily_history` for the last 120 days together with the trend data from `analyze_trend`:

  **Impulse waves (1-3-5):**
  - Wave 1: the first move of a trend reversal, on moderately rising volume.
  - Wave 3: the strongest impulse wave, usually on heavy volume with strong MACD; never the shortest wave.
  - Wave 5: volume is often weaker than in wave 3; a bearish divergence means the move is about to end after one more high.

  **Corrective waves (A-B-C):**
  - Wave A: the first decline, on fairly heavy volume; most people take it for a pullback.
  - Wave B: a rebound weaker than the earlier rise, on shrinking volume, with a high trap risk.
  - Wave C: the second decline, often larger than wave A, completing the correction.

  ### 2. Key Fibonacci levels
  - Wave 2 usually retraces 38.2%-61.8% of wave 1.
  - The wave 3 target is usually a 1.618-2.618x extension of wave 1.
  - Wave 4 must not enter the price range of wave 1 (that breaks the wave rules).
  - Wave C target: measured from the top of wave A, equal to or longer than wave A.

  ### 3. Best entries
  - **Wave 2 pullback stabilizing** (the "golden pit"): the safest entry; stop loss at the start of wave 1.
  - **Wave 4 pullback stabilizing**: second best; stop loss at the top of wave 1.
  - **Early wave 3 breakout**: when the price breaks the wave 1 high on heavy volume.
  - Avoid chasing at the end of wave 5 (bearish divergence risk).

  ### 4. Risk notes
  - Do not take a large position in a wave B rebound (it is a trap).
  - Wave counts are subjective; confirm them with other technical indicators.
  - If a wave rule is broken (for example wave 4 entering wave 1), recount the waves.

  ### 5. Output requirements
  - Give the likely current wave position (for example "in the middle of wave 3" or "possibly a wave 4 correction").
  - Give the key Fibonacci support/resistance levels (0.382/0.618/1.618).
  - State whether now is a time to buy, to wait for an opportunity, or to avoid the stock.
  - Give the confidence of the wave count (High/Medium/Low).

  Suggested score adjustments:
  - Stabilizing at the bottom of wave 2 (golden pit): `sentiment_score +15`
  - Confirmed wave 3 breakout: `sentiment_score +12`
  - End of wave 5 / bearish divergence: `sentiment_score -10`
  - During the wave C decline: `sentiment_score -12`
