# Rising Three Methods
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.
# Western continuation pattern: a long bullish candle, three small pullback candles inside its range, then a
# bullish candle that closes above the first one. US/Canada replacement for the A-share "一阳夹三阴" strategy.

name: rising_three_methods
display_name: Rising Three Methods
description: Detects the Rising Three Methods continuation pattern (a strong bullish candle, three small pullback candles inside its range, then a breakout close) in an existing uptrend.
category: pattern
core_rules: [2, 4]
required_tools:
  - get_daily_history
  - analyze_trend
  - analyze_pattern
aliases: [rising three methods, rising 3 methods, three methods]
default_priority: 110
market_regimes: [trending_up]

instructions: |
  **Rising Three Methods**

  Pattern definition (the last 5 trading sessions):

  1. **Day 1**: a long bullish candle (close > open, body larger than 2% of the price).
  2. **Days 2-4**: three small candles, usually bearish or neutral:
     - each low stays above Day 1's open;
     - each close stays inside Day 1's body;
     - volume contracts (each day below Day 1's volume; volume ratio below 0.8 is ideal).
  3. **Day 5**: a bullish candle that closes above Day 1's close, preferably on rising volume.

  How to evaluate it with the tools:

  1. Use `get_daily_history` for the last 10-20 sessions and check the last 5 candles against the definition.
  2. Use `analyze_pattern` to see whether other patterns (for example a bearish engulfing or an evening star)
     contradict the setup.
  3. Use `analyze_trend` to confirm the trend (core rule 2: bullish alignment, MA5 > MA10 > MA20). The pattern is
     a continuation signal; without an uptrend it is much weaker.
  4. Check the pullback depth: if Days 2-4 retrace more than half of Day 1's body, treat the pattern as failed.

  Scoring:
  - Pattern confirmed and the trend is bullish: `sentiment_score +15`
  - Pattern confirmed but the trend is unclear: `sentiment_score +5`
  - Pattern failed (a close below Day 1's open): `sentiment_score -5`
  - Name "Rising Three Methods" in `pattern_analysis` and `buy_reason`.
  - Ideal entry near Day 5's close (core rule 4: prefer a low-volume pullback if price is already extended);
    stop loss just below Day 1's open.
