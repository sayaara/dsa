# Volume Breakout Strategy
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.
# Price breaks above resistance on heavy volume (>2x average).

name: volume_breakout
display_name: Volume Breakout
description: Detects a breakout above resistance on heavy volume. Suits stocks trading near a known resistance level.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [volume breakout, breakout]
default_priority: 30
market_regimes: [trending_up]

instructions: |
  **Volume Breakout Strategy**

  Breakout criteria:

  1. **Resistance identification**:
     - Use `analyze_trend` → resistance_levels to get the resistance levels.
     - Usually the 20-day high or the top of an earlier consolidation range.

  2. **Volume confirmation** (core idea 3: efficiency first):
     - Today's volume > 2x the 5-day average.
     - Confirm with `get_realtime_quote` → volume_ratio > 2.0.
     - Cross-check the average volume with `get_daily_history`.

  3. **Price confirmation** (core idea 1: strict entry):
     - The close must be above the resistance level.
     - The close should be in the top 30% of the day's range (a strong close).
     - Bias check after the breakout: still < 5%, to avoid chasing.

  4. **Follow-through** (if data is available):
     - The next day should open above the breakout level, which separates a real breakout from a false one.

  5. **Risk filter** (core idea 5: risk screening):
     - Use `search_stock_news` to check for no major negative news.
     - PE should not be excessive (avoid bubble-type breakouts).

  Score adjustments:
  - Confirmed high-volume breakout: sentiment_score +12
  - Breakout together with sector strength (the sector is also rising): an extra +5
  - Set the ideal entry near the breakout level and the stop loss 3% below it.
  - Note "volume breakout" in `buy_reason` and `volume_analysis`.
