# Box Range Trading Strategy
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.
# Buy at box support, sell at box resistance, profit from range-bound oscillation.

name: box_oscillation
display_name: Box Oscillation
description: "Identifies a price box range: buy near the bottom of the box and trim near the top. Suits sideways, range-bound markets."
category: framework
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases: [box oscillation, box range, trading range, range trading, range bound]
default_priority: 50
market_regimes: [sideways]

instructions: |
  **Box Range Trading Strategy**

  Core logic: inside a box, the price swings repeatedly between resistance and support.
  "Buy near support, sell near resistance" and capture the range through swing trades.

  ## Analysis steps

  ### 1. Identify the box
  Use `get_daily_history` for the last 60-120 days:

  - **Box top (resistance)**: the line through recent highs that were touched several times but not broken.
    Usually an area where highs clustered 3 or more times within 20-60 days.
  - **Box bottom (support)**: the line through recent lows that were tested several times but not broken.
  - Validity: the top and the bottom must each be touched at least 2-3 times.
  - Use the support_levels / resistance_levels from `analyze_trend` to help locate them.

  ### 2. Judge the current position
  Use `get_realtime_quote` for the current price and compare it with the box edges:

  - **Bottom zone** (within 5% of support): a buy/add signal; stop loss 3% below the box bottom.
  - **Middle zone** (the middle third of the box): watch, take no action.
  - **Top zone** (within 5% of resistance): a reduce/take-profit signal; do not chase.

  ### 3. Volume as a guide
  - **Stabilizing at the bottom on rising volume**: a strong sign that support holds; a larger position is acceptable.
  - **Stalling at the top on shrinking volume**: a sell signal that resistance holds.
  - **Breaking out of the box (volume above 2x the average)**:
    - A valid upside breakout → switch to the bull trend strategy; new target = the box height projected upward.
    - A valid downside break → exit and wait; the old support becomes resistance.

  ### 4. Box width and expected return
  - Box width: (top - bottom) / bottom × 100%.
  - Width < 5%: too little room; do not trade it.
  - Width 5%-15%: a standard box; swing trading is workable.
  - Width > 15%: a large box; bigger swings are possible.

  ### 5. Spotting false breakouts
  - Touching resistance/support intraday, then pulling back quickly and closing inside the box → a false breakout; keep trading the box.
  - Two consecutive closes beyond a box edge with rising volume → a real breakout; change strategy.

  ### 6. Output requirements
  - Give the box top price and box bottom price explicitly.
  - State the zone the current price is in (bottom/middle/top).
  - If the price has broken out, state the direction and the new target.
  - Suggest a position size and a stop-loss level.

  Suggested score adjustments:
  - Stabilizing at the box bottom on shrinking volume: `sentiment_score +10`
  - Rising from the box bottom toward the top on higher volume: `sentiment_score +12`
  - Valid upside breakout of the box: `sentiment_score +15, switch to the trend strategy`
  - In the top zone: `sentiment_score -5 (no chasing)`
  - Valid break below the box bottom: `sentiment_score -15, exit`
