# Default Bull Trend Strategy
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.

name: bull_trend
display_name: Bull Trend
description: "The default stock-analysis strategy: identifies a bullish moving-average alignment, trend continuation and buy-the-dip pullbacks."
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [bull trend, uptrend, trend analysis, trend]
default_active: true
default_router: true
default_priority: 10
market_regimes: [trending_up]

instructions: |
  **Default Bull Trend Strategy**

  When to use:
  - The default strategy for regular single-stock analysis.
  - Look first for setups that combine "an uptrend + controllable risk + no chasing".

  Analysis framework:

  1. **Trend confirmation (highest priority)**
     - Use `analyze_trend` to read the MA5/MA10/MA20 alignment.
     - MA5 >= MA10 >= MA20 with MA20 sloping up counts as a bullish structure.
     - If the price is clearly below MA20, lower the weight of the bullish case.

  2. **Position and timing**
     - Prefer "a pullback that holds" over "chasing at a high".
     - When the price is far above MA5/MA10, say to wait for a pullback.
     - A high-volume breakout of real resistance can raise the win-rate rating.

  3. **Volume-price confirmation**
     - Use `get_daily_history` to check whether breakout or rebound days came on higher volume.
     - Be careful with rises on shrinking volume; watch for disagreement when heavy volume brings no further gain.

  4. **Trading advice output**
     - State a clear "buy / watch / reduce" leaning and its trigger conditions.
     - Always give a stop-loss reference (for example below MA20 or below the structural low).
     - If there is no clear edge, say plainly "no trade for now" to avoid overtrading.

  Suggested score adjustments:
  - Bullish alignment with good trend strength: `sentiment_score +12`
  - Stabilizing after a pullback to a key moving average: `sentiment_score +8`
  - High-volume breakout of key resistance: `sentiment_score +10`
  - Break below MA20 or a weakening trend: `sentiment_score -12`
