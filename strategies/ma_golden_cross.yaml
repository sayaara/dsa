# MA Golden Cross Strategy
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.
# MA5 crosses above MA10 (or MA10 above MA20) with volume confirmation.

name: ma_golden_cross
display_name: MA Golden Cross
description: Detects a moving-average golden cross confirmed by volume, a classic trend-reversal or continuation signal.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [ma golden cross, moving average cross, golden cross]
default_priority: 20
market_regimes: [trending_up]

instructions: |
  **MA Golden Cross Strategy**

  Signal criteria:

  1. **Golden cross detection** (core idea 2: trend trading):
     - Use `analyze_trend` to check the moving-average alignment and the MACD state.
     - Main signal: MA5 crossed above MA10 within the last 3 trading days.
     - Strong signal: MA10 crossed above MA20 (slower but more reliable).
     - Check whether MACD shows a golden cross, or a golden cross above the zero line.

  2. **Volume confirmation** (core idea 3: efficiency first):
     - Volume on the cross day should be above the 5-day average.
     - Verify with `get_daily_history`.
     - A volume ratio > 1.2 on the cross day is a positive signal.

  3. **Trend context**:
     - A golden cross after consolidation: the strongest signal.
     - A golden cross within an uptrend: a continuation signal.
     - A golden cross during a deep decline: a weak signal that needs more confirmation.

  4. **Price position** (core idea 1: strict entry):
     - The price should be near or above the crossing moving averages.
     - Bias < 5%: avoid a late, chasing entry.

  Score adjustments:
  - MA5 × MA10 golden cross with volume: sentiment_score +10
  - MA10 × MA20 golden cross: sentiment_score +8
  - MACD golden cross above the zero line: an extra +5
  - Note "MA golden cross" in `ma_analysis` and `buy_reason`.
  - Set the ideal entry near the level of the crossing moving averages.
