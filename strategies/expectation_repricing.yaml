# Expectation Repricing Strategy
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.

name: expectation_repricing
display_name: Expectation Repricing
description: Analyzes changes in earnings, policy and valuation expectations to find an expectation gap that may close, or the pullback risk after expectations overheat.
category: framework
core_rules: [3, 5, 6]
required_tools:
  - search_stock_news
  - get_stock_info
  - get_realtime_quote
  - analyze_trend
aliases: [expectation repricing, expectation gap, expectations, repricing]
default_priority: 65
market_regimes: [volatile, sector_hot]

instructions: |
  **Expectation Repricing Strategy**

  When to use:
  - Market expectations about the company's earnings, policy, industry conditions, valuation anchor or competitive position are changing.
  - You need to judge whether the current price reflects "expectations recovering", "expectations disappointed" or "expectations overheated".

  Analysis framework:

  1. **Sources of expectation**
     - Use `search_stock_news` to find recent information that changed market expectations: earnings guidance, analyst views, contracts, policy, product progress, industry data.
     - Separate hard information (filings, financial reports, contracts) from soft information (rumors, opinions, sentiment).

  2. **Direction of the expectation gap**
     - Positive gap: the market was pessimistic, and new information shows the business or earnings are better than expected.
     - Negative gap: the market was optimistic, and new information falls short or fails to confirm.
     - If a run of strong gains already reflects the information, flag the risk that the expectation has been priced in.

  3. **Valuation repricing**
     - Use PE/PB, market value, ROE, cash flow and similar fields to judge whether a re-rating has fundamental support.
     - A higher valuation must be matched by earnings quality, durable growth and industry room.
     - When the valuation falls, check whether a one-off disturbance or a lasting change in the thesis caused it.

  4. **Price confirmation**
     - Use `analyze_trend` to judge whether the change in expectations has turned into a trend.
     - A high-volume breakout can be read as money confirming the new expectation; a low-volume rebound is more of a recovery to watch.
     - Heavy volume with no further gain at a high, no rise on good news, or a break below key support may mean expectations are weakening.

  Output requirements:
  - State which applies now: positive expectation gap / expectation priced in / negative expectation gap / expectations unclear.
  - Explain which information changed market expectations and which still needs confirmation.
  - Give watch points: the next financial report, contract delivery, a policy decision, a valuation pullback or technical confirmation.

  Suggested score adjustments:
  - A positive expectation gap not yet fully priced in: `sentiment_score +15`
  - A positive expectation gap already priced in by a run of strong gains: `sentiment_score -5`
  - A negative expectation gap or a core assumption proven wrong: `sentiment_score -15`
  - Insufficient information but a possible recovery: stay neutral and lower the confidence
