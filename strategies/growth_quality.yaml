# Growth Quality Strategy
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.

name: growth_quality
display_name: Growth Quality
description: Combines revenue and profit growth, ROE, cash flow and industry headroom to identify high-quality growth stocks and the risk of growth stalling.
category: framework
core_rules: [2, 3, 5]
required_tools:
  - get_stock_info
  - get_realtime_quote
  - search_stock_news
  - analyze_trend
aliases: [growth quality, growth stocks, growth stock, growth]
default_priority: 55
market_regimes: [trending_up]

instructions: |
  **Growth Quality Strategy**

  When to use:
  - Focus on the company's medium- to long-term growth capacity, not only on short-term chart patterns.
  - Suits companies in strong industries, with steadily improving results, or in an expansion phase of their business model.

  Analysis framework:

  1. **Growth**
     - Look first at revenue, net income attributable to shareholders, operating cash flow and ROE in the financial data.
     - Judge whether revenue growth and profit growth move together, or whether revenue grows without profit.
     - If there is only thematic hype and the financials have not confirmed it, lower the growth certainty.

  2. **Quality**
     - The higher and steadier the ROE, the better the quality.
     - Operating cash flow moving with net income means more reliable earnings quality.
     - When cash flow is much weaker than profit, flag collection, inventory or receivables risk.

  3. **Valuation tolerance**
     - Use PE/PB, market value and other valuation fields to judge whether the market has already priced in future growth.
     - High growth can support a higher valuation, but say whether growth can cover it.
     - With a high valuation and slowing growth, lower the score clearly.

  4. **Trend confirmation**
     - Use `analyze_trend` to judge whether market money has confirmed the long-term growth thesis.
     - When the fundamentals improve but the chart has not confirmed it, give watch conditions rather than buying outright.

  Output requirements:
  - State which applies: high-quality growth / growth being verified / growth slowing / growth thesis disproven.
  - Explain whether growth comes from revenue expansion, margin improvement, industry conditions or one-off factors.
  - Give entries suited to a growth stock: a breakout after results confirm, a pullback to a long-term moving average, or a valuation pullback.

  Suggested score adjustments:
  - Revenue, profit, cash flow and ROE all improving: `sentiment_score +15`
  - Industry conditions and company news confirming each other: an extra `+6`
  - High valuation with unverified growth: `sentiment_score -8`
  - Revenue growing without profit, or cash flow deteriorating: `sentiment_score -12`
