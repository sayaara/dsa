# Event Driven Strategy
# NOTE: `display_name`, `description` and `aliases` are English: `display_name` and `description` are shown in the
# Web UI and the agent prompt, and `aliases` are the /ask matching vocabulary. The `instructions` block is still
# Chinese until it is translated behind an eval (audit A6/A7). tests/test_strategy_aliases_guard.py enforces this.

name: event_driven
display_name: Event Driven
description: Assesses catalyst strength, the probability it plays out and the risk boundaries around events such as earnings, policy changes, M&A, orders and product launches.
category: framework
core_rules: [3, 5]
required_tools:
  - search_stock_news
  - get_realtime_quote
  - analyze_trend
aliases: [event driven, event-driven, catalyst event, catalyst]
default_priority: 45
market_regimes: [sector_hot, volatile]

instructions: |
  **Event Driven Strategy**

  When to use:
  - The company or its industry has a clear event catalyst, such as earnings guidance, a contract win, a merger or restructuring, a policy decision, a product launch, a regulatory penalty or litigation.
  - You need to judge whether the event is a short-term trading catalyst, a lasting fundamental improvement, or good news already priced in.

  Analysis framework:

  1. **Classify the event**
     - Use `search_stock_news` to list the recent key events.
     - Classify them as: earnings, policy, contract/product, corporate finance, or regulatory/risk events.
     - Establish when each event happened; stale or undated information cannot be the main basis.

  2. **Impact path**
     - Judge whether the event affects revenue, margins, valuation, financing capacity or market share, or only sentiment.
     - For a major contract or favorable policy, explain the time to realization and the uncertainty.
     - For regulatory action, insider selling, penalties or litigation, put the risk first.

  3. **Market reaction**
     - Use `get_realtime_quote` and `analyze_trend` to judge whether the price already reflects the event.
     - A high-volume rise that has not cleared key resistance can wait for confirmation.
     - Heavy volume with no further gain at a high, or a spike that fades after good news, signals profit-taking pressure.

  4. **Trading plan**
     - Before the event plays out, stress position control and the time window.
     - After it plays out, reassess whether to switch from "trading the expectation" to "verifying with results".
     - For a negative event, first check whether the risk has been fully released, then consider a rebound.

  Output requirements:
  - State the nature of the event: positive / negative / neutral / uncertain.
  - Give the event's credibility, time to realization and how much is already priced in.
  - The advice must include invalidation conditions, such as an announcement that disappoints, a break below key support, or fading attention to the event.

  Suggested score adjustments:
  - A credible positive event not yet fully priced in: `sentiment_score +14`
  - A positive event already largely priced in: `sentiment_score -6`
  - A negative event still unfolding: `sentiment_score -15`
  - Unclear impact or conflicting information: stay neutral and lower the confidence
